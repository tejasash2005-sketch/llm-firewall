[package]
name = "llm-firewall"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "LLM Data Leakage Firewall: TLS-intercepting PII/secret masking proxy with eBPF transparent redirection"
license = "Apache-2.0"

[dependencies]
# eBPF
aya = "0.13"
libc = "0.2"

# async runtime / HTTP
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"

# TLS (ring backend only; no aws-lc-rs)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
time = "0.3"

# detection / state
aho-corasick = "1"
regex = "1"
dashmap = "6"
sha2 = "0.10"
rand = "0.8"
zeroize = "1"

# serialization
serde_json = { version = "1", features = ["preserve_order"] }

# errors / logging / CLI
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
